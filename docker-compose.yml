version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-budaya-app
    ports:
      - "3000:3000"
    environment:
      - APP_NAME=event-budaya-ticketing
      - APP_ENV=production
      - APP_PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_NAME=event_budaya_db
      - JWT_SECRET=your-production-jwt-secret-change-this
      - JWT_EXPIRY_HOURS=24
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - event-budaya-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: event-budaya-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=event_budaya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - event-budaya-network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: event-budaya-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - event-budaya-network
    restart: unless-stopped

networks:
  event-budaya-network:
    driver: bridge

volumes:
  postgres_data:
